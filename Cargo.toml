[package]
name = "grocerylist"
version = "0.1.0"
edition = "2024"
publish = false

default-run = "grocerylist"

[[bin]]
name = "gen-doc"
path = "src/bin/doc.rs"

[[bin]]
name = "grocerylist"
path = "src/bin/serve.rs"


[dependencies]
sqlx = { version = "0.9.0", features = ["chrono", "runtime-tokio", "postgres", "migrate", "macros", "uuid"] }
serde = { version = "1" }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde", "now"] }

jsonwebtoken = { version = "11.1.0" }

figment = { version = "0.10", features = ["env", "toml"] }
figment_file_provider_adapter = { version = "0.1" }

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"

utoipa-axum = "0.3"
utoipa = { version = "6.0", features = ["chrono", "axum_extras", "uuid"] }
axum = { version = "0.8.9", features = ["default", "macros", "json", "http2", "tracing"] }
axum-extra = { version = "0.12.6", features = ["typed-header", ] }
tower-http = { version = "0.7", features = ["timeout", "trace"] }
moka = { version = "0.12", features = ["future"] }


# Swagger deps
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"], optional = true }
argon2 = "0.6.0"
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[features]
swagger = ["dep:utoipa-swagger-ui"]



[profile.dev.package.sqlx-macros]
opt-level = 3


[lints.clippy]
result_large_err = "allow"
